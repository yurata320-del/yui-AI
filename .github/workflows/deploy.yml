# mainブランチに何かがpushされるたびに、自動で
#   1. アプリをビルド(公開できる形に組み立てる)して
#   2. GitHub Pagesに置きかえる
# というロボット(GitHub Actions)の設定。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHubの画面から手動で動かすこともできるようにする

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true' # next.config.mjs に「GitHub Pages向けにビルドして」と伝える目印
          # スマホからAIを使うための、インターネット上のAIサーバー(Cloudflare Worker)の住所。
          # GitHubの Settings > Secrets and variables > Actions > Variables に
          # AI_URL という名前で登録する(例: https://yui-test-master-ai.○○.workers.dev/)
          # 登録していないときは空っぽになり、AIは使わず自分で入力する形になる。
          NEXT_PUBLIC_AI_URL: ${{ vars.AI_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
